name: Build and Publish Basalt Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  release-windows:
    name: Windows x64 Release (basalt.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies and build WebUI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Generate checksum and release notes
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag || 'v0.1.0' }}" }
          $exe = "target/release/basalt.exe"
          if (-not (Test-Path $exe)) { throw "Missing release binary at $exe" }
          $bytes = (Get-Item $exe).Length
          $mb = [Math]::Round($bytes / 1MB, 2).ToString("0.00", [System.Globalization.CultureInfo]::InvariantCulture)
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item $exe "dist-release/basalt.exe" -Force
          "$sha  basalt.exe" | Out-File -FilePath "dist-release/SHA256SUMS.txt" -Encoding ascii -NoNewline
          $bytesFmt = $bytes.ToString("N0", [System.Globalization.CultureInfo]::InvariantCulture)
          $notes = @(
            "## Basalt $tag (Windows x64 Portable)"
            ""
            "- **Binary:** ``basalt.exe`` (``$mb MB`` / ``$bytesFmt bytes``)"
            "- **SHA-256:** ``$sha``"
            "- **Commit:** ``${{ github.sha }}``"
            ""
            "### Verification (PowerShell)"
            "``````powershell"
            "Get-FileHash .\basalt.exe -Algorithm SHA256"
            "``````"
          ) -join "`n"
          $notes | Out-File -FilePath "dist-release/RELEASE_NOTES.md" -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist-release/basalt.exe dist-release/SHA256SUMS.txt --clobber
            gh release edit $tag --title "Basalt $tag" --notes-file dist-release/RELEASE_NOTES.md --latest
          } else {
            gh release create $tag dist-release/basalt.exe dist-release/SHA256SUMS.txt --title "Basalt $tag" --notes-file dist-release/RELEASE_NOTES.md --latest --target "${{ github.sha }}"
          }
