name: Build and Publish Basalt Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.2.0"
      prerelease:
        description: "Publish as GitHub Pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  release-windows:
    name: Windows x64 Release (basalt.exe + .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies and build WebUI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Package EXE, ZIP, checksums, and release notes
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag || 'v0.2.0' }}" }
          $exe = "target/release/basalt.exe"
          if (-not (Test-Path $exe)) { throw "Missing release binary at $exe" }

          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $exeOut = "dist-release/basalt.exe"
          $zipName = "basalt-$tag-windows-x64.zip"
          $zipOut = "dist-release/$zipName"
          Copy-Item $exe $exeOut -Force
          Compress-Archive -Path $exeOut -DestinationPath $zipOut -Force

          $exeBytes = (Get-Item $exeOut).Length
          $exeMb = [Math]::Round($exeBytes / 1MB, 2).ToString("0.00", [System.Globalization.CultureInfo]::InvariantCulture)
          $exeSha = (Get-FileHash $exeOut -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeBytesFmt = $exeBytes.ToString("N0", [System.Globalization.CultureInfo]::InvariantCulture)

          $zipBytes = (Get-Item $zipOut).Length
          $zipMb = [Math]::Round($zipBytes / 1MB, 2).ToString("0.00", [System.Globalization.CultureInfo]::InvariantCulture)
          $zipSha = (Get-FileHash $zipOut -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipBytesFmt = $zipBytes.ToString("N0", [System.Globalization.CultureInfo]::InvariantCulture)

          @(
            "$exeSha  basalt.exe"
            "$zipSha  $zipName"
          ) -join "`n" | Out-File -FilePath "dist-release/SHA256SUMS.txt" -Encoding ascii

          $isPre = ("$tag" -match '^v0\.') -or ("$tag" -match '-') -or ("${{ inputs.prerelease }}" -eq "true")
          $preLabel = if ($isPre) { "Pre-release" } else { "Release" }
          $title = if ($isPre) { "Basalt $tag (Pre-release)" } else { "Basalt $tag" }
          $highlights = if ($tag -like 'v0.3*') {
            @(
              "- **Isolated Vanilla / Fabric / Forge Loader Profiles:** Separate per-version ``mods/`` folders (``loader_mods/fabric/<ver>`` via ``-Dfabric.modsFolder`` and ``profiles/forge/<ver>/mods`` via Forge BootstrapLauncher) while seamlessly sharing ``saves/``, ``shaderpacks/``, ``resourcepacks/``, ``screenshots/``, ``options.txt``, and ``servers.dat``"
              "- **Built-in Modrinth v2 Library:** Browse & search **Mods**, **Shaders**, and **Resource Packs**, sort by downloads/relevance/follows/updated, view installed badges, and auto-install required mod dependencies (e.g. Fabric API)"
              "- **1-Click Shader & FPS Kits:** Install **Fabric** (Fabric API + Sodium + Iris Shaders + Lithium + Complementary Unbound) or **Forge** (Embeddium + Oculus + Complementary Unbound) in a single click"
              "- **OptiFine & Custom File Manager:** Import local ``.jar`` mods / OptiFine or ``.zip`` shader & resource packs; toggle ``.disabled`` status or remove files directly in the Installed tab"
              "- **Full En / Tr / De Localization & Console Mode:** Play loader selector, responsive Library view across Light & Dark themes, and Fullscreen Console (DeckMode) Library card"
              "- **Windows Schannel TLS & Unsigned Notice:** Includes ``--ssl-revoke-best-effort`` for reliable Modrinth/Fabric downloads; if SmartScreen appears on unsigned builds, extract the ``.zip`` or click **More info -> Run anyway**"
            )
          } else {
            @(
              "- Fix Windows built-in ``curl.exe`` (Schannel) download error ``exit code 2`` when ``--http2`` is unsupported, with automatic capability probing and fallback"
              "- Live cursor-tracking 3D WebGL Minecraft skin viewer across Play, Profile & Skin, and Fullscreen Console"
              "- Refined Daylight & Ember theme contrast, Fullscreen Console top bar spacing, Turkish localization, and Quick Launch sidebar density"
              "- Unsigned open-source build: if Windows SmartScreen appears, extract the ``.zip`` or click **More info -> Run anyway**"
            )
          }
          $notes = @(
            "## Basalt $tag ($preLabel · Windows x64 Portable)"
            ""
            "### Downloads"
            "- **Portable EXE:** ``basalt.exe`` (``$exeMb MB`` / ``$exeBytesFmt bytes``) — SHA-256: ``$exeSha``"
            "- **Portable ZIP:** ``$zipName`` (``$zipMb MB`` / ``$zipBytesFmt bytes``) — SHA-256: ``$zipSha``"
            ""
            "### What's New"
          ) + $highlights + @(
            ""
            "- **Commit:** ``${{ github.sha }}``"
            ""
            "### Verification (PowerShell)"
            "``````powershell"
            "Get-FileHash .\basalt.exe -Algorithm SHA256"
            "Get-FileHash .\$zipName -Algorithm SHA256"
            "``````"
          ) -join "`n"
          $notes | Out-File -FilePath "dist-release/RELEASE_NOTES.md" -Encoding utf8
          $isPreStr = if ($isPre) { "true" } else { "false" }
          $makeLatestStr = if ($isPre) { "false" } else { "true" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_pre=$isPreStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "make_latest=$makeLatestStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish or update GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: dist-release/RELEASE_NOTES.md
          prerelease: ${{ steps.meta.outputs.is_pre }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            dist-release/basalt.exe
            dist-release/${{ steps.meta.outputs.zip_name }}
            dist-release/SHA256SUMS.txt
