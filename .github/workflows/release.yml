name: Build and Publish Basalt Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.2.0"
      prerelease:
        description: "Publish as GitHub Pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  release-windows:
    name: Windows x64 Release (basalt.exe + .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies and build WebUI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Package EXE, ZIP, checksums, and release notes
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag || 'v0.2.0' }}" }
          $exe = "target/release/basalt.exe"
          if (-not (Test-Path $exe)) { throw "Missing release binary at $exe" }

          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $exeOut = "dist-release/basalt.exe"
          $zipName = "basalt-$tag-windows-x64.zip"
          $zipOut = "dist-release/$zipName"
          Copy-Item $exe $exeOut -Force
          Compress-Archive -Path $exeOut -DestinationPath $zipOut -Force

          $exeBytes = (Get-Item $exeOut).Length
          $exeMb = [Math]::Round($exeBytes / 1MB, 2).ToString("0.00", [System.Globalization.CultureInfo]::InvariantCulture)
          $exeSha = (Get-FileHash $exeOut -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeBytesFmt = $exeBytes.ToString("N0", [System.Globalization.CultureInfo]::InvariantCulture)

          $zipBytes = (Get-Item $zipOut).Length
          $zipMb = [Math]::Round($zipBytes / 1MB, 2).ToString("0.00", [System.Globalization.CultureInfo]::InvariantCulture)
          $zipSha = (Get-FileHash $zipOut -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipBytesFmt = $zipBytes.ToString("N0", [System.Globalization.CultureInfo]::InvariantCulture)

          @(
            "$exeSha  basalt.exe"
            "$zipSha  $zipName"
          ) -join "`n" | Out-File -FilePath "dist-release/SHA256SUMS.txt" -Encoding ascii

          $isPre = ("$tag" -match '-') -or ("$tag" -eq 'v0.2.0') -or ("${{ inputs.prerelease }}" -eq "true")
          $preLabel = if ($isPre) { "Pre-release" } else { "Release" }
          $notes = @(
            "## Basalt $tag ($preLabel · Windows x64 Portable)"
            ""
            "### Downloads"
            "- **Portable EXE:** ``basalt.exe`` (``$exeMb MB`` / ``$exeBytesFmt bytes``) — SHA-256: ``$exeSha``"
            "- **Portable ZIP:** ``$zipName`` (``$zipMb MB`` / ``$zipBytesFmt bytes``) — SHA-256: ``$zipSha``"
            ""
            "### Highlights"
            "- Fix Windows built-in ``curl.exe`` (Schannel) download error ``exit code 2`` when ``--http2`` is unsupported, with automatic capability probing and fallback"
            "- Live cursor-tracking 3D WebGL Minecraft skin viewer across Play, Profile & Skin, and Fullscreen Console"
            "- Refined Daylight & Ember theme contrast, Fullscreen Console top bar spacing, Turkish localization, and Quick Launch sidebar density"
            "- Unsigned open-source build: if Windows SmartScreen appears, extract the ``.zip`` or click **More info -> Run anyway**"
            ""
            "- **Commit:** ``${{ github.sha }}``"
            ""
            "### Verification (PowerShell)"
            "``````powershell"
            "Get-FileHash .\basalt.exe -Algorithm SHA256"
            "Get-FileHash .\$zipName -Algorithm SHA256"
            "``````"
          ) -join "`n"
          $notes | Out-File -FilePath "dist-release/RELEASE_NOTES.md" -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_pre=$isPre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipOut = "dist-release/${{ steps.meta.outputs.zip_name }}"
          $isPre = "${{ steps.meta.outputs.is_pre }}" -eq "True"
          $title = if ($isPre) { "Basalt $tag (Pre-release)" } else { "Basalt $tag" }
          $flags = if ($isPre) { @("--prerelease") } else { @("--latest") }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist-release/basalt.exe $zipOut dist-release/SHA256SUMS.txt --clobber
            gh release edit $tag --title $title --notes-file dist-release/RELEASE_NOTES.md @flags
          } else {
            gh release create $tag dist-release/basalt.exe $zipOut dist-release/SHA256SUMS.txt --title $title --notes-file dist-release/RELEASE_NOTES.md @flags --target "${{ github.sha }}"
          }
