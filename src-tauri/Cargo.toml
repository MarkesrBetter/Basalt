[package]
name = "basalt-desktop"
version = "0.3.0"
edition = "2024"
description = "Basalt desktop WebUI shell powered by Tauri 2 and Basalt Rust core"

[[bin]]
name = "basalt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
basalt = { path = ".." }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
